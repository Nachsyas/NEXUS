name: NEXUS CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  governance-validation:
    name: Governance & Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Core Governance Files
        run: |
          test -f AGENTS.md
          test -f README.md
          test -f LICENSE-STATUS.md
          test -f docs/README.md
          test -f docs/context/PROJECT-STATE.md
          test -f docs/context/HANDOFF.md
          test -f docs/context/CURRENT-STAGE.md
          test -f docs/context/NEXT-ACTIONS.md
          test -f docs/context/KNOWN-ISSUES.md
          test -f docs/validation/CONSISTENCY-MATRIX.md

      - name: Verify No Internal Absolute file:/// Markdown Links
        run: |
          ! grep -rn "](file:///" docs/ AGENTS.md README.md

  backend-ci:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff Lint Check
        run: uv run ruff check .

      - name: Ruff Format Check
        run: uv run ruff format --check .

      - name: Mypy Type Check
        run: uv run mypy app tests

      - name: Apply Database Migrations
        run: uv run alembic upgrade head

      - name: Pytest Execution
        run: uv run pytest -v
